<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-4xl font-bold text-gray-800">
                    <i class="fas fa-calendar-alt text-blue-600"></i>
                    Rota Management
                </h1>
                <button onclick="openStaffModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg shadow-lg transition duration-200 transform hover:scale-105">
                    <i class="fas fa-user-plus mr-2"></i>Add Staff
                </button>
            </div>

            <!-- Week Navigation -->
            <div class="bg-white rounded-xl shadow-md p-4 flex justify-between items-center gap-4">
                <button onclick="previousWeek()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg transition duration-200">
                    <i class="fas fa-chevron-left mr-2"></i>Previous Week
                </button>
                <div class="flex-1 text-center">
                    <h2 id="weekDisplay" class="text-2xl font-bold text-gray-800"></h2>
                    <p class="text-sm text-gray-500 mt-1">Week of <span id="weekDates"></span></p>
                </div>
                <div class="flex items-center gap-2">
                    <label for="weekPicker" class="text-sm text-gray-600">Jump to:</label>
                    <input type="date" id="weekPicker" class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <button onclick="nextWeek()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg transition duration-200">
                    Next Week<i class="fas fa-chevron-right ml-2"></i>
                </button>
            </div>
        </div>

        <!-- Rota Grid -->
        <div class="bg-white rounded-xl shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full" id="rotaTable">
                    <thead>
                        <tr class="bg-gradient-to-r from-blue-600 to-purple-600 text-white">
                            <th class="py-4 px-6 text-left font-semibold text-lg">Staff Member</th>
                            <th class="py-4 px-4 text-center font-semibold">Monday</th>
                            <th class="py-4 px-4 text-center font-semibold">Tuesday</th>
                            <th class="py-4 px-4 text-center font-semibold">Wednesday</th>
                            <th class="py-4 px-4 text-center font-semibold">Thursday</th>
                            <th class="py-4 px-4 text-center font-semibold">Friday</th>
                            <th class="py-4 px-4 text-center font-semibold">Saturday</th>
                            <th class="py-4 px-4 text-center font-semibold">Sunday</th>
                        </tr>
                    </thead>
                    <tbody id="rotaBody">
                        <!-- Rows will be dynamically generated -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Staff Management Section -->
        <div class="mt-8 bg-white rounded-xl shadow-md p-6">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">
                <i class="fas fa-users text-blue-600 mr-2"></i>Staff Members
            </h3>
            <div id="staffList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Staff cards will be dynamically generated -->
            </div>
        </div>
    </div>

    <!-- Add/Edit Staff Modal -->
    <div id="staffModal" class="modal">
        <div class="modal-content bg-white rounded-xl shadow-2xl p-6 max-w-md mx-auto mt-20">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-gray-800">
                    <i class="fas fa-user-edit text-blue-600 mr-2"></i>
                    <span id="modalTitle">Add Staff Member</span>
                </h2>
                <button onclick="closeStaffModal()" class="text-gray-400 hover:text-gray-600 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="staffForm" class="space-y-4">
                <input type="hidden" id="staffId">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Name *</label>
                    <input type="text" id="staffName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Email</label>
                    <input type="email" id="staffEmail" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Phone</label>
                    <input type="tel" id="staffPhone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Role</label>
                    <input type="text" id="staffRole" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., Manager, Waiter, Chef">
                </div>
                <div class="flex gap-2 pt-4">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
                        <i class="fas fa-save mr-2"></i>Save
                    </button>
                    <button type="button" onclick="closeStaffModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-700 font-semibold py-2 px-4 rounded-lg transition duration-200">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add/Edit Shift Modal -->
    <div id="shiftModal" class="modal">
        <div class="modal-content bg-white rounded-xl shadow-2xl p-6 max-w-md mx-auto mt-20">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-gray-800">
                    <i class="fas fa-clock text-blue-600 mr-2"></i>
                    <span id="shiftModalTitle">Add Shift</span>
                </h2>
                <button onclick="closeShiftModal()" class="text-gray-400 hover:text-gray-600 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="shiftForm" class="space-y-4">
                <input type="hidden" id="shiftId">
                <input type="hidden" id="shiftStaffId">
                <input type="hidden" id="shiftDate">
                <div>
                    <p class="text-gray-700 font-semibold mb-2">
                        <i class="fas fa-user mr-2"></i>Staff: <span id="shiftStaffName" class="text-blue-600"></span>
                    </p>
                    <p class="text-gray-700 font-semibold mb-2">
                        <i class="fas fa-calendar mr-2"></i>Date: <span id="shiftDateDisplay" class="text-blue-600"></span>
                    </p>
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Start Time *</label>
                    <input type="time" id="shiftStartTime" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">End Time *</label>
                    <input type="time" id="shiftEndTime" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Role (optional)</label>
                    <input type="text" id="shiftRole" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., Duty Manager, Shift Manager">
                </div>
                <div class="flex gap-4">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="shiftIsHoliday" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">On Holiday</span>
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="shiftIsDayOff" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">Day Off</span>
                    </label>
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Notes</label>
                    <textarea id="shiftNotes" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div class="flex gap-2 pt-4">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
                        <i class="fas fa-save mr-2"></i>Save Shift
                    </button>
                    <button type="button" onclick="closeShiftModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-700 font-semibold py-2 px-4 rounded-lg transition duration-200">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
