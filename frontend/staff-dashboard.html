<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Schedule - Rota Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50 min-h-screen">
    <div class="container mx-auto px-4 py-6">
        <!-- Header -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">
                        <i class="fas fa-calendar-alt text-blue-600 mr-2"></i>
                        My Schedule
                    </h1>
                    <p class="text-gray-600">Welcome, <span id="staffName" class="font-semibold"></span></p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <div class="text-sm text-gray-500">Logged in as</div>
                        <div id="usernameDisplay" class="font-semibold text-gray-800"></div>
                    </div>
                    <button onclick="openHolidayRequestModal()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg transition duration-200">
                        <i class="fas fa-umbrella-beach mr-2"></i>Request Holiday
                    </button>
                    <button onclick="Auth.logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition duration-200">
                        <i class="fas fa-sign-out-alt mr-2"></i>Logout
                    </button>
                </div>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="bg-white rounded-lg shadow-lg mb-6">
            <div class="flex border-b border-gray-200">
                <button id="fullRotaTab" class="flex-1 px-6 py-4 text-center font-semibold transition duration-200 border-b-4 border-blue-600 text-blue-600">
                    <i class="fas fa-users mr-2"></i>Full Rota
                </button>
                <button id="myShiftsTab" class="flex-1 px-6 py-4 text-center font-semibold transition duration-200 border-b-4 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">
                    <i class="fas fa-user-clock mr-2"></i>My Shifts
                </button>
                <button id="holidayRequestsTab" class="flex-1 px-6 py-4 text-center font-semibold transition duration-200 border-b-4 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">
                    <i class="fas fa-umbrella-beach mr-2"></i>Holiday Requests
                </button>
                <button id="shiftSwapsTab" class="flex-1 px-6 py-4 text-center font-semibold transition duration-200 border-b-4 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">
                    <i class="fas fa-exchange-alt mr-2"></i>Shift Swaps
                    <span id="swapNotificationBadge" class="hidden ml-2 bg-red-500 text-white text-xs px-2 py-1 rounded-full"></span>
                </button>
            </div>
        </div>

        <!-- Week Navigation -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <div class="flex justify-between items-center">
                <button id="prevWeek" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition duration-200">
                    <i class="fas fa-chevron-left mr-2"></i>Previous Week
                </button>

                <div class="flex items-center gap-4">
                    <div class="text-center">
                        <div class="text-sm text-gray-500 mb-1">Week of</div>
                        <h2 id="weekDisplay" class="text-xl font-bold text-gray-800"></h2>
                    </div>
                    <input type="date" id="datePicker" class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button id="nextWeek" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition duration-200">
                    Next Week<i class="fas fa-chevron-right ml-2"></i>
                </button>
            </div>

            <!-- Weekly Hours Summary (only shown in My Shifts view) -->
            <div id="weeklyHoursSummary" class="mt-4 pt-4 border-t border-gray-200 hidden">
                <div class="flex justify-center items-center gap-2">
                    <i class="fas fa-clock text-blue-600"></i>
                    <span class="text-gray-700">My Total Hours This Week:</span>
                    <span id="weeklyHours" class="text-2xl font-bold text-blue-600">0.0</span>
                    <span class="text-gray-500">hours</span>
                </div>
            </div>
        </div>

        <!-- Full Rota View -->
        <div id="fullRotaView" class="bg-white rounded-lg shadow-lg p-6">
            <div class="overflow-x-auto">
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="bg-gradient-to-r from-blue-600 to-purple-600 text-white">
                            <th class="border border-gray-300 px-4 py-3 text-left sticky left-0 bg-gradient-to-r from-blue-600 to-purple-600">
                                Staff
                            </th>
                            <th class="border border-gray-300 px-4 py-3 text-center" id="day0">Mon</th>
                            <th class="border border-gray-300 px-4 py-3 text-center" id="day1">Tue</th>
                            <th class="border border-gray-300 px-4 py-3 text-center" id="day2">Wed</th>
                            <th class="border border-gray-300 px-4 py-3 text-center" id="day3">Thu</th>
                            <th class="border border-gray-300 px-4 py-3 text-center" id="day4">Fri</th>
                            <th class="border border-gray-300 px-4 py-3 text-center" id="day5">Sat</th>
                            <th class="border border-gray-300 px-4 py-3 text-center" id="day6">Sun</th>
                        </tr>
                    </thead>
                    <tbody id="rotaBody">
                        <!-- Rota rows will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- My Shifts View -->
        <div id="myShiftsView" class="bg-white rounded-lg shadow-lg p-6 hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="bg-gradient-to-r from-blue-600 to-purple-600 text-white">
                            <th class="px-4 py-3 text-left rounded-tl-lg">Day</th>
                            <th class="px-4 py-3 text-left">Date</th>
                            <th class="px-4 py-3 text-left">Shifts</th>
                            <th class="px-4 py-3 text-left rounded-tr-lg">Hours</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody">
                        <!-- Schedule rows will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
        <!-- Holiday Requests View -->
        <div id="holidayRequestsView" class="bg-white rounded-lg shadow-lg p-6 hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                <i class="fas fa-umbrella-beach mr-2 text-green-600"></i>
                My Holiday Requests
            </h2>
            <div id="holidayRequestsList">
                <!-- Holiday requests will be inserted here -->
            </div>
        </div>

        <!-- Shift Swaps View -->
        <div id="shiftSwapsView" class="bg-white rounded-lg shadow-lg p-6 hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">
                    <i class="fas fa-exchange-alt mr-2 text-purple-600"></i>
                    Shift Swaps
                </h2>
                <button onclick="openProposeSwapModal()" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-lg transition duration-200">
                    <i class="fas fa-plus mr-2"></i>Propose Swap
                </button>
            </div>
            <div id="shiftSwapsList">
                <!-- Shift swaps will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Holiday Request Modal -->
    <div id="holidayRequestModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full mx-4">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">
                    <i class="fas fa-umbrella-beach mr-2 text-green-600"></i>
                    Request Holiday
                </h3>
                <button onclick="closeHolidayRequestModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>

            <form id="holidayRequestForm">
                <div class="mb-4">
                    <label for="startDate" class="block text-sm font-semibold text-gray-700 mb-2">
                        Start Date <span class="text-red-500">*</span>
                    </label>
                    <input type="date" id="startDate" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>

                <div class="mb-4">
                    <label for="endDate" class="block text-sm font-semibold text-gray-700 mb-2">
                        End Date <span class="text-red-500">*</span>
                    </label>
                    <input type="date" id="endDate" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>

                <div class="mb-6">
                    <label for="reason" class="block text-sm font-semibold text-gray-700 mb-2">
                        Reason (Optional)
                    </label>
                    <textarea id="reason" rows="3"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                        placeholder="e.g., Family vacation"></textarea>
                </div>

                <div id="holidayErrorMessage" class="hidden bg-red-100 text-red-700 px-4 py-3 rounded-lg mb-4">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="holidayErrorText"></span>
                </div>

                <div class="flex gap-3">
                    <button type="button" onclick="closeHolidayRequestModal()"
                        class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-lg transition duration-200">
                        Cancel
                    </button>
                    <button type="submit"
                        class="flex-1 bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
                        <i class="fas fa-paper-plane mr-2"></i>Submit Request
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Propose Swap Modal -->
    <div id="proposeSwapModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-2xl p-8 max-w-lg w-full mx-4">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">
                    <i class="fas fa-exchange-alt mr-2 text-purple-600"></i>
                    Propose Shift Swap
                </h3>
                <button onclick="closeProposeSwapModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>

            <form id="proposeSwapForm">
                <div class="mb-4">
                    <label for="myShiftSelect" class="block text-sm font-semibold text-gray-700 mb-2">
                        Your Shift to Offer <span class="text-red-500">*</span>
                    </label>
                    <select id="myShiftSelect" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="">Select a shift...</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="recipientSelect" class="block text-sm font-semibold text-gray-700 mb-2">
                        Swap With <span class="text-red-500">*</span>
                    </label>
                    <select id="recipientSelect" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="">Select staff member...</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="recipientShiftSelect" class="block text-sm font-semibold text-gray-700 mb-2">
                        Receive Their Shift (Optional - leave empty to give away)
                    </label>
                    <select id="recipientShiftSelect"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="">None - just give away my shift</option>
                    </select>
                    <p class="text-xs text-gray-500 mt-1">If empty, you're offering to give your shift away without receiving one back</p>
                </div>

                <div class="mb-6">
                    <label for="swapMessage" class="block text-sm font-semibold text-gray-700 mb-2">
                        Message (Optional)
                    </label>
                    <textarea id="swapMessage" rows="3"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                        placeholder="e.g., I have a family commitment that day"></textarea>
                </div>

                <div id="swapErrorMessage" class="hidden bg-red-100 text-red-700 px-4 py-3 rounded-lg mb-4">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="swapErrorText"></span>
                </div>

                <div class="flex gap-3">
                    <button type="button" onclick="closeProposeSwapModal()"
                        class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-lg transition duration-200">
                        Cancel
                    </button>
                    <button type="submit"
                        class="flex-1 bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
                        <i class="fas fa-paper-plane mr-2"></i>Propose Swap
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/auth.js"></script>
    <script src="/static/staff-dashboard.js"></script>
</body>
</html>
